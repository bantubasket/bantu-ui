<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seller Login | Bantu Basket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#e4cbb5] bg-[linear-gradient(135deg,#f2e5d8_0%,#dec2a9_60%,#c9a184_100%)] bg-fixed font-sans text-cocoa selection:bg-[#ead3c0]">
    <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true"><div class="absolute -left-48 -top-52 h-[620px] w-[620px] rounded-full border-[80px] border-white/25"></div><div class="absolute -bottom-64 -right-40 h-[720px] w-[720px] rounded-full border-[100px] border-brand/10"></div><div class="absolute left-1/2 top-0 h-[600px] w-[850px] -translate-x-1/2 rounded-full bg-[#fff4e4]/30 blur-3xl"></div></div>
    <main class="relative mx-auto flex min-h-screen w-full max-w-[520px] flex-col justify-center px-5 py-8 sm:py-12">
        <a href="sell.html" class="mb-5 inline-flex w-fit items-center gap-2 text-xs font-medium text-[#79553e] hover:text-brand-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand"><span aria-hidden="true">&larr;</span> Back to selling on Bantu Basket</a>
        <section class="overflow-hidden rounded-[24px] border border-white/80 bg-white shadow-[0_24px_70px_-12px_#633b2930]" aria-labelledby="login-title">
            <div class="h-1 bg-gradient-to-r from-brand-dark via-brand to-[#d6ae89]" aria-hidden="true"></div>
            <div class="px-7 pb-8 pt-9 sm:px-10 sm:pb-10">
                <a href="index.html" class="inline-flex" aria-label="Bantu Basket home"><img src="assets/img/logo/bantu.png" alt="Bantu Basket" class="h-11 w-[190px] object-contain object-left"></a>
                <h1 id="login-title" class="mt-8 text-[32px] font-semibold leading-tight tracking-tight text-[#493428]">Seller login</h1>
                <p class="mt-2 text-sm leading-relaxed text-[#8a786a]">Welcome back. Log in to manage your store, products and orders.</p>
                <form id="login-form" method="post" action="#" class="mt-7">
                    <label for="login-identity" class="text-xs font-medium text-[#655044]">Email address or phone number</label>
                    <input id="login-identity" name="username" type="text" autocomplete="username" required maxlength="254" placeholder="Enter your email or phone number" class="mt-2 w-full rounded-xl border border-[#ddd2c8] bg-[#fdfcfb] px-4 py-3 text-sm text-cocoa outline-none transition placeholder:text-[#a3978c] hover:border-[#c4aa96] focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10">
                    <div class="mt-5"><label for="login-password" class="text-xs font-medium text-[#655044]">Password</label><div class="relative"><input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password" class="mt-2 w-full rounded-xl border border-[#ddd2c8] bg-[#fdfcfb] px-4 py-3 text-sm text-cocoa outline-none transition placeholder:text-[#a3978c] hover:border-[#c4aa96] focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10 pr-12"><button id="toggle-login-password" type="button" aria-label="Show password" aria-pressed="false" class="absolute bottom-0 right-1 flex h-[46px] w-10 items-center justify-center rounded-lg text-[#947461] hover:text-brand focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
                    <div class="mt-3 text-right"><a href="forgot-password.html" class="text-xs font-medium text-brand hover:underline focus-visible:outline-brand">Forgot password?</a></div>
                    <button type="submit" class="mt-6 w-full rounded-xl bg-brand px-5 py-3.5 text-sm font-semibold text-white transition hover:bg-brand-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand">Log in to your store</button>
                </form>
                <div class="my-5 flex items-center gap-3 text-[11px] text-[#a39488]"><span class="h-px flex-1 bg-[#eee5dc]"></span>or<span class="h-px flex-1 bg-[#eee5dc]"></span></div>
                <button type="button" data-login-action="google" class="flex w-full items-center justify-center gap-3 rounded-xl border border-[#ddd2c8] bg-white px-4 py-3 text-sm font-medium text-[#493f38] transition hover:bg-[#fcf8f4] focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.2h6.7c3.9-3.6 6-8.9 6-15.1Z"></path><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.2c-1.8 1.2-4.1 2-6.8 2-5.3 0-9.8-3.6-11.4-8.4H5.7v5.4A20.4 20.4 0 0 0 24 44Z"></path><path fill="#FBBC05" d="M12.6 27.5a12.2 12.2 0 0 1 0-7V15H5.7a20 20 0 0 0 0 18l6.9-5.5Z"></path><path fill="#EA4335" d="M24 12.1c3 0 5.6 1 7.7 3l5.8-5.8A19.5 19.5 0 0 0 24 4 20.4 20.4 0 0 0 5.7 15l6.9 5.5C14.2 15.7 18.7 12.1 24 12.1Z"></path></svg> Continue with Google</button>
                <p id="login-status" role="status" class="mt-4 rounded-xl border border-[#ead8c8] bg-[#fff8f1] px-4 py-3 text-xs leading-relaxed text-[#8b5033]" hidden></p>
                <p class="mt-6 text-center text-sm text-[#8a786a]">Not a seller yet? <a href="apply.html" class="font-semibold text-brand underline underline-offset-4 focus-visible:outline-brand">Apply to sell</a></p>
                <p class="mt-7 text-center text-[11px] leading-relaxed text-[#a18e80]">By continuing, you agree to our <button type="button" data-login-action="terms" class="underline underline-offset-2 hover:text-brand">Terms of Service</button> and <button type="button" data-login-action="privacy" class="underline underline-offset-2 hover:text-brand">Privacy Policy</button>.</p>
            </div>
        </section>
        <p class="mt-6 text-center text-[11px] text-[#886750]">&copy; Bantu Basket. A taste of home.</p>
    </main>
    <script src="assets/js/login.js"></script>
</body>
</html>
