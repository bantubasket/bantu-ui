<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Seller Password | Bantu Basket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#e4cbb5] bg-[linear-gradient(135deg,#f2e5d8_0%,#dec2a9_60%,#c9a184_100%)] bg-fixed font-sans text-cocoa selection:bg-[#ead3c0]">
    <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true"><div class="absolute -left-48 -top-52 h-[620px] w-[620px] rounded-full border-[80px] border-white/25"></div><div class="absolute -bottom-64 -right-40 h-[720px] w-[720px] rounded-full border-[100px] border-brand/10"></div><div class="absolute left-1/2 top-0 h-[600px] w-[850px] -translate-x-1/2 rounded-full bg-[#fff4e4]/30 blur-3xl"></div></div>
    <main class="relative mx-auto flex min-h-screen w-full max-w-[520px] flex-col justify-center px-5 py-8 sm:py-12">
        <a href="login.html" class="mb-5 inline-flex w-fit items-center gap-2 text-xs font-medium text-[#79553e] hover:text-brand-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand"><span aria-hidden="true">&larr;</span> Back to seller login</a>
        <section class="overflow-hidden rounded-[24px] border border-white/80 bg-white shadow-[0_24px_70px_-12px_#633b2930]" aria-labelledby="reset-title">
            <div class="h-1 bg-gradient-to-r from-brand-dark via-brand to-[#d6ae89]" aria-hidden="true"></div>
            <div class="px-7 pb-8 pt-9 sm:px-10 sm:pb-10">
                <a href="index.html" class="inline-flex" aria-label="Bantu Basket home"><img src="assets/img/logo/bantu.png" alt="Bantu Basket" class="h-11 w-[190px] object-contain object-left"></a>
                <div class="mt-8 flex h-12 w-12 items-center justify-center rounded-2xl bg-[#fbefe5] text-brand" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v3"/></svg></div>
                <h1 id="reset-title" class="mt-5 text-[30px] font-semibold leading-tight tracking-tight text-[#493428]">Forgot your password?</h1>
                <p id="reset-description" class="mt-3 text-sm leading-relaxed text-[#8a786a]">Enter the email address linked to your seller account to request a password reset link.</p>
                <form id="seller-reset-form" method="post" action="#" aria-describedby="reset-description" class="mt-7">
                    <label for="seller-reset-email" class="text-xs font-medium text-[#655044]">Seller account email</label>
                    <input id="seller-reset-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="Enter your email address" class="mt-2 w-full rounded-xl border border-[#ddd2c8] bg-[#fdfcfb] px-4 py-3 text-sm text-cocoa outline-none transition placeholder:text-[#a3978c] hover:border-[#c4aa96] focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10">
                    <button type="submit" class="mt-6 w-full rounded-xl bg-brand px-5 py-3.5 text-sm font-semibold text-white transition hover:bg-brand-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand">Send reset link</button>
                    <p id="seller-reset-status" role="status" class="mt-4 rounded-xl border border-[#ead8c8] bg-[#fff8f1] px-4 py-3 text-xs leading-relaxed text-[#8b5033]" hidden></p>
                </form>
                <a href="login.html" class="mt-5 flex items-center justify-center gap-2 text-sm font-medium text-brand hover:underline focus-visible:outline-brand"><span aria-hidden="true">&larr;</span> Back to seller login</a>
                <p class="mt-7 border-t border-[#eee5dc] pt-5 text-center text-xs leading-relaxed text-[#9a897b]">Need help accessing your store?<br><a href="mailto:support@bantubasket.co.za" class="font-medium text-brand underline underline-offset-4">Contact our seller team</a></p>
            </div>
        </section>
        <p class="mt-6 text-center text-[11px] text-[#886750]">&copy; Bantu Basket. A taste of home.</p>
    </main>
    <script src="assets/js/forgot-password.js"></script>
</body>
</html>
